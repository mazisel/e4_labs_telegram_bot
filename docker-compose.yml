services:
  telegram-bot:
    build: .
    container_name: katilim_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Kılavuz komutlarına izinli Telegram ID'leri (virgülle); boşsa herkese açık
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
    volumes:
      # Persist temp files if needed (optional)
      - ./temp:/app/temp
    # No ports needed - bot uses polling, not webhooks
